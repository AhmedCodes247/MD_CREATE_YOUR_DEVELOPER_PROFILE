<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAY_6_DOM</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2 class="form-title">Create Your Developer Profile 💻</h2>

    <form>
      <label for="nameInput" id="nameLabel">Full Name:</label>
      <input type="text" id="nameInput" placeholder="Full Name" />
      <br />
      <label for="emailInput" id="emailLabel">Email Address:</label>
      <input type="email" id="emailInput" placeholder="Email Address" />
      <br />
      <label for="passwordInput" id="passwordLabel">Create Password:</label>
      <input type="password" id="passwordInput" placeholder="Create Password" />
      <p id="result"></p>
    </form>
    <button onclick="showResult()">Join Now</button>
    <script src="app.js"></script>
  </body>
</html>
